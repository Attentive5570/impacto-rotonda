name: Extraer escenario Antes

on:
  workflow_dispatch:   # se ejecuta a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: datos-rotonda

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Consultar TomTom (escenario Antes)
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: python extraer_antes.py

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico_antes_tomtom.csv
          if git diff --staged --quiet; then
            echo "Sin cambios para guardar."
          else
            git commit -m "Actualiza escenario Antes"
            git pull --rebase
            git push
          fi
